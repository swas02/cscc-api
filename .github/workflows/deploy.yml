name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Vite Portal & API Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Static CSCC Data Assets
        run: |
          mkdir -p public/v1
          if [ -d "cscc-local/data" ] && [ -f "cscc-local/meta.json" ]; then
            echo "Using compiled binaries from cscc-local..."
            cp -r cscc-local/data public/v1/
            cp cscc-local/meta.json public/v1/
          else
            echo "Fetching compact binary release from cscc-local..."
            curl -sL https://github.com/swas02/cscc-local/releases/latest/download/cscc-data-binaries.zip -o cscc-data.zip
            unzip -o cscc-data.zip -d public/v1/
            rm -f cscc-data.zip
          fi

      - name: Build Vite App & Static Assets
        run: npm run build

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
